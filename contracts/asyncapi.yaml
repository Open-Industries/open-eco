asyncapi: 2.6.0
info:
  title: Open Eco — Reference Environmental Management Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.eco.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  source.created:
    publish:
      operationId: on-source-created
      message: { $ref: '#/components/messages/Generic' }
  carbon.created:
    publish:
      operationId: on-carbon-created
      message: { $ref: '#/components/messages/Generic' }
  sustainability.created:
    publish:
      operationId: on-sustainability-created
      message: { $ref: '#/components/messages/Generic' }
  offset.created:
    publish:
      operationId: on-offset-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  risk.evaluated:
    publish:
      operationId: on-risk-evaluated
      message: { $ref: '#/components/messages/Generic' }
  compliance.evaluated:
    publish:
      operationId: on-compliance-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-eco/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
