openapi: 3.1.0
info:
  title: Open Eco — Reference Environmental Management Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /emission-sources:
    post:
      operationId: create-source
      summary: "Registry of emission sources per facility."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /carbon-budgets:
    post:
      operationId: create-carbon
      summary: "Verified carbon budgets per facility and the emission entries booked against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /sustainability-rules:
    post:
      operationId: create-sustainability
      summary: "Decision rules binding emission categories to reduction capacity and audit envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /offset-projects:
    post:
      operationId: create-offset
      summary: "Catalogue of offset projects under evaluation."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
